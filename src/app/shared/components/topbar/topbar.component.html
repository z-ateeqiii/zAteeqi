<header
  class="border-border bg-ink/80 sticky top-0 z-50 border-b backdrop-blur-xl backdrop-saturate-150"
>
  <div class="mx-auto flex h-16 max-w-6xl items-center justify-between gap-4 px-5 sm:px-8">
    <div class="flex min-w-0 items-center gap-3">
      <a
        href="/"
        class="font-display text-text hover:text-signal-blue inline-flex min-h-11 shrink-0 items-center text-[15px] font-bold tracking-tight transition-colors"
      >
        zateeqi
      </a>

      <span
        class="border-signal-blue/25 bg-signal-blue/10 text-signal-blue font-mono hidden shrink-0 items-center gap-1.5 rounded-full border px-2.5 py-1 text-[11px] leading-none sm:inline-flex"
      >
        <span class="bg-signal-blue h-1 w-1 rounded-full"></span>
        {{ activePath() }}
      </span>
    </div>

    @if (sections().length > 0) {
      <nav class="hidden items-center gap-0.5 md:flex" aria-label="Section navigation">
        @for (section of sections(); track section.id) {
          <button
            type="button"
            (click)="scrollToSection(section.id)"
            [attr.aria-current]="isActive(section) ? 'true' : null"
            class="font-body hover:text-text hover:bg-surface rounded-full px-3.5 py-2 text-sm transition-all duration-200"
            [class.text-text]="isActive(section)"
            [class.bg-surface]="isActive(section)"
            [class.text-text-muted]="!isActive(section)"
          >
            {{ section.label }}
          </button>
        }
      </nav>
    }

    <div class="flex shrink-0 items-center gap-3">
      <span class="font-mono text-text-faint hidden text-[11px] lg:inline">
        {{ roleLabel() }}
      </span>

      @if (sections().length > 0) {
        <button
          type="button"
          class="border-border text-text-muted hover:border-signal-blue/45 hover:text-text grid h-9 w-9 place-items-center rounded-full border transition-colors md:hidden"
          (click)="toggleMenu()"
          [attr.aria-expanded]="isMenuOpen()"
          aria-label="Toggle navigation menu"
        >
          <span class="font-mono text-base leading-none">{{ isMenuOpen() ? '×' : '≡' }}</span>
        </button>
      }
    </div>
  </div>

  @if (isMenuOpen() && sections().length > 0) {
    <nav class="border-border bg-ink/95 border-t backdrop-blur-xl md:hidden">
      <ul class="mx-auto flex max-w-6xl flex-col px-5 py-3 sm:px-8">
        @for (section of sections(); track section.id) {
          <li>
            <button
              type="button"
              (click)="scrollToSection(section.id)"
              class="font-body flex w-full items-center justify-between rounded-lg px-3 py-3 text-left text-sm transition-colors"
              [class.text-text]="isActive(section)"
              [class.bg-surface]="isActive(section)"
              [class.text-text-muted]="!isActive(section)"
            >
              {{ section.label }}
              <span class="font-mono text-text-faint text-[11px]">{{ section.path }}</span>
            </button>
          </li>
        }
      </ul>
      <p class="font-mono text-text-faint mx-auto max-w-6xl px-5 pb-4 text-[11px] sm:px-8">
        {{ roleLabel() }}
      </p>
    </nav>
  }
</header>
