<header class="border-border bg-ink/85 sticky top-0 z-50 border-b backdrop-blur">
  <div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-4 px-4 sm:px-6">
    <div class="flex items-center gap-4 overflow-hidden">
      <a href="/" class="font-display text-text shrink-0 text-sm font-semibold tracking-tight">
        zateeqi
      </a>
      <span class="font-mono text-signal-blue hidden shrink-0 text-xs sm:inline">
        {{ activePath() }}
      </span>
    </div>

    @if (sections().length > 0) {
      <nav class="hidden items-center gap-1 md:flex">
        @for (section of sections(); track section.id) {
          <button
            type="button"
            (click)="scrollToSection(section.id)"
            class="font-body text-text-muted hover:text-text rounded px-3 py-1.5 text-sm transition-colors"
            [class.text-text]="activePath() === section.path"
          >
            {{ section.label }}
          </button>
        }
      </nav>
    }

    <div class="flex items-center gap-3">
      <span class="font-mono text-text-faint hidden shrink-0 text-xs sm:inline">
        {{ roleLabel() }}
      </span>

      @if (sections().length > 0) {
        <button
          type="button"
          class="border-border text-text grid h-8 w-8 place-items-center rounded border md:hidden"
          (click)="toggleMenu()"
          [attr.aria-expanded]="isMenuOpen()"
          aria-label="Toggle navigation menu"
        >
          <span class="font-mono text-sm">{{ isMenuOpen() ? '×' : '≡' }}</span>
        </button>
      }
    </div>
  </div>

  @if (isMenuOpen() && sections().length > 0) {
    <nav class="border-border bg-ink border-t md:hidden">
      <ul class="flex flex-col px-4 py-2">
        @for (section of sections(); track section.id) {
          <li>
            <button
              type="button"
              (click)="scrollToSection(section.id)"
              class="font-body text-text-muted w-full py-2.5 text-left text-sm"
              [class.text-text]="activePath() === section.path"
            >
              {{ section.label }}
            </button>
          </li>
        }
      </ul>
    </nav>
  }
</header>
