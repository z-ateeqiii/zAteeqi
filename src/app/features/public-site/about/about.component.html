<section id="about" class="border-border border-t">
  <div [appRevealOnScroll]="0" class="mx-auto max-w-6xl px-5 py-16 sm:px-8 md:py-22">
    <p
      class="border-signal-blue/25 bg-signal-blue/10 text-signal-blue font-mono inline-flex items-center gap-2 rounded-full border px-3 py-1 text-[11px] leading-none tracking-[0.06em]"
    >
      <span class="bg-signal-blue h-1 w-1 rounded-full"></span>
      /about
    </p>

    <h2
      class="font-display text-gradient mt-5 max-w-xl text-3xl leading-[1.1] font-semibold tracking-[-0.025em] sm:text-4xl md:text-[2.75rem]"
    >
      About
    </h2>

    <div class="mt-12 grid gap-10 lg:grid-cols-[1.15fr_1fr] lg:gap-14">
      <div class="font-body text-text-muted space-y-5 text-base leading-[1.75]">
        @for (paragraph of aboutCopy; track paragraph) {
          <p>{{ paragraph }}</p>
        }
      </div>

      <div class="border-border bg-surface/50 divide-border divide-y rounded-2xl border">
        @for (group of skillGroups; track group.label) {
          <div class="p-6">
            <p class="font-mono text-text-faint text-[10px] tracking-[0.18em] uppercase">
              {{ group.label }}
            </p>
            <ul class="mt-3.5 flex flex-wrap gap-1.5">
              @for (skill of group.skills; track skill) {
                <li
                  class="font-mono border-border bg-surface-2/60 text-text-muted hover:border-signal-blue/40 hover:text-text rounded-full border px-2.5 py-1 text-[11px] leading-none transition-colors duration-300"
                >
                  {{ skill }}
                </li>
              }
            </ul>
          </div>
        }
      </div>
    </div>
  </div>
</section>
