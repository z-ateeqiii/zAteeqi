<section id="contact" class="border-border border-t">
  <div [appRevealOnScroll]="0" class="mx-auto max-w-6xl px-5 py-16 sm:px-8 md:py-22">
    <div
      class="contact-panel border-border bg-surface/60 relative overflow-hidden rounded-3xl border px-6 py-14 text-center sm:px-12 md:py-16"
    >
      <span class="contact-panel__glow" aria-hidden="true"></span>

      <p
        class="border-signal-blue/25 bg-signal-blue/10 text-signal-blue font-mono relative inline-flex items-center gap-2 rounded-full border px-3 py-1 text-[11px] leading-none tracking-[0.06em]"
      >
        <span class="bg-signal-blue h-1 w-1 rounded-full"></span>
        /contact
      </p>

      <h2
        class="font-display text-gradient relative mx-auto mt-6 max-w-2xl text-3xl leading-[1.12] font-semibold tracking-[-0.025em] sm:text-4xl md:text-[2.75rem]"
      >
        Let's build something people can trust.
      </h2>

      <p class="font-body text-text-muted relative mx-auto mt-5 max-w-lg text-base leading-relaxed">
        Open to Angular / frontend roles and freelance projects. The fastest way to reach me is
        email.
      </p>

      <div class="relative mt-9 flex flex-wrap items-center justify-center gap-3">
        <a
          [href]="'mailto:' + profile.email"
          (click)="onCtaClick('email:contact')"
          class="bg-signal-blue hover:bg-signal-blue-hi text-ink font-body glow-blue group inline-flex items-center gap-2 rounded-full px-7 py-3.5 text-sm font-semibold transition-all duration-300 hover:-translate-y-0.5"
        >
          {{ profile.email }}
          <svg
            class="h-4 w-4 transition-transform duration-300 group-hover:translate-x-0.5"
            viewBox="0 0 16 16"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M2.5 8h11M9.5 4l4 4-4 4" />
          </svg>
        </a>
      </div>

      <div
        class="font-mono text-text-faint relative mt-9 flex flex-wrap items-center justify-center gap-x-4 gap-y-2 text-[11px]"
      >
        <a
          [href]="profile.linkedinUrl"
          target="_blank"
          rel="noopener noreferrer"
          class="hover:text-text -my-3 inline-flex min-h-11 items-center transition-colors"
        >
          linkedin.com/in/{{ profile.handle }}
        </a>
        <span class="text-text-faint/50" aria-hidden="true">·</span>
        <a
          [href]="profile.githubUrl"
          target="_blank"
          rel="noopener noreferrer"
          class="hover:text-text -my-3 inline-flex min-h-11 items-center transition-colors"
        >
          github.com/z-ateeqiii
        </a>
        <span class="text-text-faint/50" aria-hidden="true">·</span>
        <span>{{ profile.location }}</span>
      </div>
    </div>
  </div>
</section>
