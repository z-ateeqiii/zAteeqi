<section id="contact" [appRevealOnScroll]="0" class="mx-auto max-w-6xl px-4 py-24 sm:px-6">
  <div class="border-border bg-surface rounded-xl border px-6 py-14 text-center sm:px-12">
    <p class="font-mono text-signal-blue text-xs">/contact</p>
    <h2
      class="font-display text-text mx-auto mt-3 max-w-xl text-3xl font-semibold tracking-tight sm:text-4xl"
    >
      Let's build something people can trust.
    </h2>
    <p class="font-body text-text-muted mx-auto mt-4 max-w-md text-base leading-relaxed">
      Open to Angular / frontend roles and freelance projects. The fastest way to reach me is
      email.
    </p>

    <div class="mt-8 flex flex-wrap items-center justify-center gap-4">
      <a
        [href]="'mailto:' + profile.email"
        (click)="onCtaClick('email:contact')"
        class="bg-signal-blue font-body rounded-md px-6 py-3 text-sm font-medium text-white transition-transform hover:-translate-y-0.5"
      >
        {{ profile.email }}
      </a>
    </div>

    <div class="font-mono text-text-faint mt-8 flex flex-wrap items-center justify-center gap-4 text-xs">
      <a [href]="profile.linkedinUrl" target="_blank" rel="noopener noreferrer" class="hover:text-text">
        linkedin.com/in/{{ profile.handle }}
      </a>
      <span aria-hidden="true">·</span>
      <a [href]="profile.githubUrl" target="_blank" rel="noopener noreferrer" class="hover:text-text">
        github.com/z-ateeqiii
      </a>
      <span aria-hidden="true">·</span>
      <span>{{ profile.location }}</span>
    </div>
  </div>
</section>
